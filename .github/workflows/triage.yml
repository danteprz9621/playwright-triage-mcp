name: Playwright Triage

# Two jobs: run a small Playwright suite (with a few tests that fail on
# purpose) and upload its JSON report as an artifact, then a second job
# downloads that artifact and runs it through the triage MCP server --
# exactly the "save an artifact from a Playwright run, then triage that
# artifact" flow this workflow exists to demonstrate.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Install Playwright browsers
        working-directory: demo
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: demo
        # This demo suite has a few tests that fail on purpose (see
        # demo/tests/*.spec.ts) so there's something real to triage --
        # don't let that fail the job, just let it produce a report.
        run: npx playwright test
        continue-on-error: true

      - name: Upload Playwright report artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: demo/report.json
          if-no-files-found: error

  triage:
    needs: playwright-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright-triage-mcp
        run: pip install -e .

      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: demo

      - name: Run triage over the MCP server
        run: python scripts/ci_triage.py demo/report.json --source playwright

      - name: Upload triage summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-summary
          path: triage-summary.json
